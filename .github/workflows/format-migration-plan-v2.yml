name: Format typed migration-plan v2

on:
  pull_request:
    paths:
      - '.github/workflows/format-migration-plan-v2.yml'

permissions:
  contents: write

concurrency:
  group: format-migration-plan-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out the exact reviewed feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: Prove exact branch and head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$TARGET_BRANCH" = 'salvage/typed-migration-plan-v2'
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          test "$(rustc +1.88.0 --version | awk '{print $2}')" = '1.88.0'

      - name: Generate the missing lock, format, and validate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Cargo.lock
          cargo +1.88.0 generate-lockfile
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import tomllib

          lock = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          if lock.get('version') != 4:
              raise SystemExit('unexpected Cargo.lock format')
          packages = lock.get('package')
          if not isinstance(packages, list) or not all(isinstance(item, dict) for item in packages):
              raise SystemExit('Cargo.lock package list is malformed')
          roots = [item for item in packages if item.get('name') == 'declmig-interfaces']
          if len(roots) != 1:
              raise SystemExit('expected one declmig-interfaces root package')
          if sorted(roots[0].get('dependencies', [])) != ['serde', 'serde_json', 'sha2']:
              raise SystemExit('unexpected root dependency set')
          for package in packages:
              source = package.get('source')
              if source is None:
                  continue
              if source != 'registry+https://github.com/rust-lang/crates.io-index':
                  raise SystemExit(f'unreviewed dependency source: {source}')
              checksum = package.get('checksum')
              if not isinstance(checksum, str) or len(checksum) != 64:
                  raise SystemExit('registry package is missing a SHA-256 checksum')
          PY
          cargo +1.88.0 fmt --all
          cargo +1.88.0 test --locked --all-targets
          cargo +1.88.0 clippy --locked --all-targets -- -D warnings
          cargo +1.88.0 build --locked --release
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps >/dev/null
          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            exit 1
          fi

      - name: Commit canonical formatting and the reviewed lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/format-migration-plan-v2.yml
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          expected=(
            .github/workflows/format-migration-plan-v2.yml
            Cargo.lock
            src/lib.rs
            src/migration_plan_v2.rs
            tests/migration_plan_v2.rs
          )
          test "${changed[*]}" = "${expected[*]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'build: lock and format typed migration-plan v2 contract'
          git push origin "HEAD:$TARGET_BRANCH"
