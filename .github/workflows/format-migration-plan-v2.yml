name: Format typed migration-plan v2

on:
  pull_request:
    paths:
      - '.github/workflows/format-migration-plan-v2.yml'

permissions:
  contents: write

concurrency:
  group: format-migration-plan-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out the exact reviewed feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: Prove exact branch and head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$TARGET_BRANCH" = 'salvage/typed-migration-plan-v2'
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          test "$(rustc +1.88.0 --version | awk '{print $2}')" = '1.88.0'

      - name: Repair lints, format, and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected_count: int) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f'{path}: expected {expected_count} occurrences of lint pattern, found {count}'
                  )
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'src/migration_plan_v2.rs',
              '.map_or(true, |reason| reason.trim().is_empty())',
              '.is_none_or(|reason| reason.trim().is_empty())',
              1,
          )
          replace_exact(
              'src/migration_plan_v2.rs',
              'std::iter::repeat(character).take(64).collect()',
              'std::iter::repeat_n(character, 64).collect()',
              1,
          )
          replace_exact(
              'tests/migration_plan_v2.rs',
              'std::iter::repeat(character).take(64).collect()',
              'std::iter::repeat_n(character, 64).collect()',
              1,
          )
          PY
          cargo +1.88.0 fmt --all
          cargo +1.88.0 test --all-targets
          cargo +1.88.0 clippy --all-targets -- -D warnings
          cargo +1.88.0 build --release
          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            exit 1
          fi

      - name: Commit canonical formatting and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/format-migration-plan-v2.yml
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf 'changed path: %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/format-migration-plan-v2.yml|src/lib.rs|src/migration_plan_v2.rs|tests/migration_plan_v2.rs)
                ;;
              *)
                echo "unexpected changed path: $path" >&2
                exit 1
                ;;
            esac
          done
          for required in \
            .github/workflows/format-migration-plan-v2.yml \
            src/migration_plan_v2.rs \
            tests/migration_plan_v2.rs
          do
            printf '%s\n' "${changed[@]}" | grep -Fx "$required" >/dev/null
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/format-migration-plan-v2.yml \
            src/lib.rs \
            src/migration_plan_v2.rs \
            tests/migration_plan_v2.rs
          git commit -m 'style: format typed migration-plan v2 contract'
          git push origin "HEAD:$TARGET_BRANCH"
