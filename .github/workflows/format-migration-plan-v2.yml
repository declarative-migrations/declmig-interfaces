name: Format typed migration-plan v2

on:
  pull_request:
    paths:
      - '.github/workflows/format-migration-plan-v2.yml'

permissions:
  contents: write

concurrency:
  group: format-migration-plan-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Check out the exact reviewed feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: Prove exact branch and head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$TARGET_BRANCH" = 'salvage/typed-migration-plan-v2'
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          test "$(rustc +1.88.0 --version | awk '{print $2}')" = '1.88.0'

      - name: Format and validate the typed contract
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 fmt --all
          cargo +1.88.0 test --locked --all-targets
          cargo +1.88.0 clippy --locked --all-targets -- -D warnings
          cargo +1.88.0 build --locked --release
          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            exit 1
          fi

      - name: Commit canonical formatting and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm .github/workflows/format-migration-plan-v2.yml
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/format-migration-plan-v2.yml
            src/lib.rs
            src/migration_plan_v2.rs
            tests/migration_plan_v2.rs
          )
          test "${changed[*]}" = "${expected[*]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'style: format typed migration-plan v2 contract'
          git push origin "HEAD:$TARGET_BRANCH"
